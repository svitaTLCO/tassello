# Pubblica una release quando si invia un'etichetta di versione, per esempio: git tag v1.3.0 && git push origin v1.3.0
# Ricostruisce il programma, controlla che docs/ sia aggiornato, firma la provenienza del file
# e lo allega alla release con la sua impronta SHA-256.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Controlla che l'etichetta corrisponda alla versione del programma
        run: test "v$(cat ufficio/VERSIONE)" = "$GITHUB_REF_NAME"

      - name: Costruisci Tassello Ufficio
        run: python ufficio/build.py

      - name: Controlla che i file pubblicati corrispondano ai sorgenti
        run: git diff --exit-code docs/tassello-ufficio.html docs/versioni.json

      # Firma di provenienza (Sigstore): si verifica con gh attestation verify tassello-ufficio.html --repo svitaTLCO/tassello
      - name: Firma la provenienza del file
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: docs/tassello-ufficio.html

      - name: Crea la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(sha256sum docs/tassello-ufficio.html | cut -d' ' -f1)
          {
            echo "Scarica \`tassello-ufficio.html\` e aprilo con un doppio clic in Chrome o Edge recenti: funziona anche senza rete."
            echo
            echo "Impronta SHA-256: \`$sha\`"
            echo
            echo "Per controllare una copia usa la pagina [Verifica una copia](https://svitatlco.github.io/tassello/verifica.html), oppure in Windows: \`certutil -hashfile tassello-ufficio.html SHA256\`"
            echo
            echo "Firma di provenienza: \`gh attestation verify tassello-ufficio.html --repo $GITHUB_REPOSITORY\`"
          } > note.md
          gh release create "$GITHUB_REF_NAME" docs/tassello-ufficio.html \
            --title "Tassello Ufficio ${GITHUB_REF_NAME#v}" --notes-file note.md
