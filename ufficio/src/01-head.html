<style>
:root{--zoom:1;--accent:#2457c5;--accent-strong:#1b4398;--accent-text:#1b4398;--accent-soft:#e7edfa;--sel-tint:rgba(36,87,197,.13);

html[data-theme=dark]{color-scheme:dark;--bg:#1c1c1c;--chrome:#242424;--surface:#2c2c2c;--surface-2:#303030;--hover:#3a3a3a;--pressed:#464646;--line:#3d3d3d;--line-strong:#6a6a6a;--text:#f3f3f3;--text-2:#d9d9d9;--text-3:#bdbdbd;--canvas:#141414;--hdr:#2a2a2a;--focus:#fff;--accent-text:#9bbcf5;--accent-soft:#1c3156;--shadow:0 12px 32px rgba(0,0,0,.55)}

:focus{outline:none}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.split{display:inline-flex;align-items:center}

.style-card:hover{border-color:var(--accent);background:var(--accent-soft)}

.style-card .sample{color:var(--text);font-family:Calibri,'Segoe UI',sans-serif;font-size:14px;white-space:nowrap}
.style-card .sample.h1{font-size:17px;color:var(--accent-text);font-weight:600}
.style-card .sample.h2{font-size:15px;color:var(--accent-text);font-weight:600}
.style-card .sample.h3{font-size:14px;color:var(--accent-text);font-weight:600}
.style-card .sample.q{font-style:italic;color:var(--text-2)}

.findbar{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;padding:8px 14px;background:var(--surface);border-bottom:1px solid var(--line);flex-shrink:0}

.findbar input[type=search],.findbar input[type=text]{height:30px;width:200px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);color:var(--text);padding:0 8px}
.find-count{min-width:84px;color:var(--text-2);font-size:12px}
.btn{height:30px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);color:var(--text);padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}

.main{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}

.word-scroll{background:var(--canvas);overflow:auto;flex:1;padding:28px 18px 90px}
.page{width:794px;min-height:1123px;margin:0 auto;background:#fff;color:#171717;box-shadow:0 1px 3px rgba(0,0,0,.14),0 8px 24px rgba(0,0,0,.10);zoom:var(--zoom);position:relative;border-radius:2px}

.page:focus-within{box-shadow:0 0 0 2px var(--accent),0 8px 24px rgba(0,0,0,.14)}
.word-content{--doc-font:Calibri,'Segoe UI',Arial,sans-serif;--doc-line:1.15;--doc-space:8pt;padding:96px 94px;min-height:inherit;outline:0;line-height:var(--doc-line);overflow-wrap:break-word;font-family:var(--doc-font);font-size:11pt;color:#171717;caret-color:#000}

.word-content h1{font-size:20pt;margin:14px 0 8px;color:#1f3864;font-weight:600}
.word-content h2{font-size:15pt;margin:12px 0 6px;color:#2f5496;font-weight:600}
.word-content h3{font-size:12.5pt;margin:10px 0 5px;color:#2f5496;font-weight:600}
.word-content ul,.word-content ol{padding-left:32px;margin:0 0 var(--doc-space)}
.word-content table{border-collapse:collapse;margin:10px 0;max-width:100%;min-width:120px}
.word-content td,.word-content th{border:1px solid #8c8c8c;padding:5px 8px;min-width:48px;vertical-align:top}
.word-content th{background:#f2f2f2;text-align:left;font-weight:600}
.word-content img{max-width:100%;height:auto}

.word-content sup.fn{color:#0f4394;font-weight:600}

.word-content hr.sect::after{content:attr(title);position:absolute;top:-11px;left:50%;transform:translateX(-50%);max-width:88%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font:11px 'Segoe UI',sans-serif;color:#33456b;background:#fff;padding:0 8px}
.word-content sup.en{color:#0f4394;font-weight:600}
.word-content .endnotes{font-size:9.5pt;color:#333;margin-top:24px}
.show-marks span.bm::before{content:'[';color:#4d6fc0;font-weight:700}
.show-marks span.bm::after{content:']';color:#4d6fc0;font-weight:700}
.word-content span.xe{display:none}
.show-marks span.xe{display:inline;color:#4d6fc0;font-size:.85em;border-bottom:1px dotted #4d6fc0}
.word-content a.xref,.word-content a.cite{color:inherit;text-decoration:none;background:#eef2f9;border-bottom:1px dotted #7a8fb8;border-radius:2px;padding:0 1px}
.word-content a.xref:hover,.word-content a.cite:hover{color:#0563c1}
.word-content :is(.tof,.idx,.biblio){border:1px dashed #b4c0d3;border-radius:4px;padding:8px 12px;margin-bottom:12px}
.word-content :is(.tof-title,.idx-title,.biblio-title){font-size:14pt;color:#2f5496;font-weight:600;margin-bottom:6px}
.word-content :is(.tof,.idx) p{margin:0 0 3px}
.word-content :is(.tof,.idx) a{color:inherit;text-decoration:none;border-bottom:1px dotted #8ea0bd}
.word-content .idx .idx-letter{font-weight:700;margin-top:8px}
.word-content .idx .idx-sub{margin-left:18pt}
.word-content .biblio p:not(.biblio-title){padding-left:36pt;text-indent:-36pt}
.word-content span.cc{display:inline-block;min-width:1.2em;padding:0 4px;border:1px solid #9fb1d4;border-radius:3px;background:#f3f6fc;cursor:pointer;line-height:1.35;text-indent:0}
.word-content span.cc-check{font-family:'Segoe UI Symbol','Segoe UI',sans-serif;padding:0 3px}
.word-content span.cc-drop::after{content:' ▾';color:#4a5a7a}

.word-content span.cc.cc-active{outline:2px solid #2b579a;outline-offset:1px}
.form-fill .word-content span.cc{background:#fff6cc;border-color:#a67c00}
.word-content .textbox{border:1px solid #8eaadb;padding:6px 10px;margin:4px 0 8px;box-sizing:border-box;background:#fff}

.word-content .textbox.tbx-center{margin-left:auto;margin-right:auto;clear:both}
.word-content .textbox>:last-child{margin-bottom:0}
.word-content span.eq{display:inline-block;padding:0 2px;cursor:pointer;text-indent:0}

.logo-pick{margin:8px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.print-sect{display:none}
@media print{.page.has-psec #wordEditor{display:none!important}.page.has-psec .print-sect{display:block!important}.word-content span.cc{border:0!important;background:none!important;padding:0!important;outline:0!important}.word-content span.cc-drop::after{content:''!important}.word-content :is(.tof,.idx,.biblio){border:0!important;padding:0!important}.word-content :is(a.xref,a.cite){background:none!important;border:0!important}.word-content .textbox{break-inside:avoid}}
.word-content ::selection{background:#b5d1f3}
::highlight(find-all){background-color:#ffe58a;color:#000}

/* Excel */

.grid-area{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
