<style>
/* Mosaico: la finestra è fatta di tasselli (--surface) appoggiati su una fuga (--grout) che prende il colore dell'app. */
:root{--zoom:1;--accent:#2457c5;--accent-strong:#1b4398;--accent-text:#1b4398;--accent-soft:#e7edfa;--sel-tint:rgba(36,87,197,.13);
--grout:#dce3ef;--grout-deep:#cbd4e4;--gap:8px;--r:10px;--fold:var(--accent);--scrim:rgba(16,22,34,.16);
--bg:var(--grout);--chrome:#fff;--surface:#fff;--surface-2:#f1f3f7;--hover:#e9edf3;--pressed:#dde2ea;--line:#e1e5ec;--line-strong:#a9b0bc;--text:#161b26;--text-2:#3e4757;--text-3:#596374;--canvas:#e8ebf0;--hdr:#f1f3f7;--focus:#161b26;--danger:#b10e1c;
--shadow:0 12px 32px rgba(20,24,34,.18),0 2px 8px rgba(20,24,34,.08);--lift:0 18px 40px rgba(20,24,34,.26),0 2px 6px rgba(20,24,34,.1);color-scheme:light;
--mono:'Cascadia Mono',Consolas,ui-monospace,'Courier New',monospace;
font-family:'Segoe UI Variable Text','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;font-size:13px;color:var(--text)}
html[data-mode=excel]{--accent:#1e7a46;--accent-strong:#155c34;--accent-text:#155c34;--accent-soft:#e3f1e8;--sel-tint:rgba(30,122,70,.14);--grout:#dae7df;--grout-deep:#c8dacf}
html[data-theme=dark]{color-scheme:dark;--grout:#0f131b;--grout-deep:#080b10;--scrim:rgba(0,0,0,.45);--chrome:#1e2026;--surface:#1e2026;--surface-2:#272a31;--hover:#2f333c;--pressed:#3a3f49;--line:#363a44;--line-strong:#6b7280;--text:#eef1f6;--text-2:#c9d0db;--text-3:#a3acbb;--canvas:#16181d;--hdr:#272a31;--focus:#fff;--accent-text:#9bbcf5;--accent-soft:#1c3156;--shadow:0 12px 32px rgba(0,0,0,.55);--lift:0 18px 40px rgba(0,0,0,.6)}
html[data-theme=dark][data-mode=excel]{--accent-text:#82d3a4;--accent-soft:#163a26;--grout:#0e1511;--grout-deep:#070c09}
html[data-contrast=high]{--grout:#fff;--grout-deep:#fff;--line:#000;--line-strong:#000;--text-2:#000;--text-3:#111;--hover:#cfcfcf;--accent-text:#002a66}
html[data-contrast=high][data-mode=excel]{--accent-text:#003d1c;--grout:#fff;--grout-deep:#fff}
html[data-contrast=high][data-theme=dark]{--grout:#000;--grout-deep:#000;--line:#fff;--line-strong:#fff;--text-2:#fff;--text-3:#fff;--hover:#4a4a4a;--accent-text:#b5d0ff}
html[data-contrast=high][data-theme=dark][data-mode=excel]{--accent-text:#9ff0c2;--grout:#000;--grout-deep:#000}
html[data-contrast=high] .tool,html[data-contrast=high] .tb,html[data-contrast=high] .ditem,html[data-contrast=high] .rb-select,html[data-contrast=high] .btn{border:1px solid var(--line-strong)}
/* In contrasto elevato la fuga diventa una linea di 2 px intorno a ogni tassello. */
html[data-contrast=high] .tile{outline:2px solid var(--line-strong);outline-offset:-2px}
html[data-contrast=high] .tessera,html[data-contrast=high] .chip,html[data-contrast=high] .st-btn{box-shadow:inset 0 0 0 2px var(--line-strong)}
html[data-contrast=high] :focus-visible{outline-width:3px}
@media (forced-colors:active){.tile,.tessera,.chip,.st-btn,.drawer,.dgroup,.palette,.pal-field,#palList{border:1px solid CanvasText}}
*,*::before,*::after{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--text)}
[hidden],.hidden{display:none!important}
button,select,input,textarea{color:inherit;font:inherit}
button{cursor:pointer}button:disabled,[aria-disabled=true]{opacity:.45;cursor:not-allowed}
:focus{outline:none}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
kbd{font:600 11px/1 'Segoe UI',system-ui,sans-serif;display:inline-block;padding:3px 6px;border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:4px;background:var(--surface);color:var(--text-2);white-space:nowrap}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:fixed;left:10px;top:-80px;z-index:1000;background:var(--surface);color:var(--text);padding:10px 16px;border-radius:8px;box-shadow:var(--shadow);font-weight:600;text-decoration:none}
.skip:focus{top:10px}
.ico{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;display:block}
.ti-text{font-weight:600;font-size:15px;line-height:1;min-width:18px;text-align:center;font-family:'Segoe UI',system-ui,sans-serif;white-space:nowrap}
.ti-text i{font-family:Georgia,serif}
#app{display:flex;flex-direction:column;height:100dvh;min-width:0}
/* Tasselli e angolo: l'angolo piegato del logo segna l'azione principale e il tassello in cui si lavora. */
.tile{background:var(--surface);border-radius:var(--r);position:relative}
.primary-tile::after,.tile.is-active::after,.pal-field::after{content:'';position:absolute;top:0;right:0;width:14px;height:14px;border-bottom-left-radius:4px;background:linear-gradient(to bottom left,var(--corner-bg,var(--grout)) 50%,var(--fold) 50%);pointer-events:none;z-index:8}
/* Barra: una riga di tasselli al posto di titolo, schede e barra multifunzione. */
.bar{display:flex;align-items:stretch;gap:var(--gap);padding:var(--gap) var(--gap) 0;flex-shrink:0;position:relative;z-index:30;min-width:0}
.bar>.tile{height:48px;flex:0 0 auto}
.brand-tile{display:flex;align-items:center;gap:4px;padding:0 6px}
.brand{width:38px;height:38px;border:0;border-radius:8px;background:transparent;display:grid;place-items:center;padding:0}
.brand:hover{background:var(--hover)}
.brand-mark{width:24px;height:24px;flex:none}
.app-switch{display:flex;gap:2px;padding:3px;border-radius:9px;background:var(--surface-2)}
.app-switch button{display:flex;align-items:center;gap:7px;height:32px;padding:0 10px 0 6px;border:0;border-radius:7px;background:transparent;color:var(--text-2);font-weight:600}
.app-switch button:hover{background:var(--hover);color:var(--text)}
.app-switch button[aria-pressed=true]{background:var(--surface);color:var(--accent-text);box-shadow:0 1px 3px rgba(20,24,34,.16)}
.app-logo{width:20px;height:20px;border-radius:5px;display:grid;place-items:center;background:var(--pressed);color:var(--text-2)}
.app-logo svg{display:block}
.app-switch button[aria-pressed=true] .app-logo{background:var(--accent);color:#fff}
.doc-tile{display:flex;flex-direction:column;justify-content:center;gap:1px;padding:0 12px 0 14px;min-width:120px}
.bar>.doc-tile{flex:0 1 220px}
.doc-tile input{width:100%;min-width:0;height:24px;margin-left:-6px;padding:0 5px;border:1px solid transparent;border-radius:6px;background:transparent;color:var(--text);font-weight:700;font-size:14px}
.doc-tile input:hover{border-color:var(--line-strong)}
.doc-tile input:focus{background:var(--surface-2)}
.save-state{font-size:12px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{min-width:0;display:flex;align-items:center;gap:2px;padding:0 6px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.bar>.tools{flex:1 1 0}
.bar.tight>.doc-tile{flex-basis:150px}.bar.tight .tb.drw{padding:0 7px}.bar.tight .tb.drw .chev{display:none}
.bar.wrap{flex-wrap:wrap}.bar.wrap>.tools{order:9;flex:1 1 100%;scrollbar-width:thin}.bar.wrap>.doc-tile{flex:1 1 160px}
.tools>div{display:flex;align-items:center;gap:2px;flex-shrink:0}
.tb{flex-shrink:0;height:36px;min-width:36px;border:0;border-radius:8px;background:transparent;color:var(--text);display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:0 9px;white-space:nowrap}
.tb.icon{width:36px;padding:0}
.tb:hover{background:var(--hover)}.tb:active{background:var(--pressed)}
.tb[aria-pressed=true],.tb[aria-expanded=true]{background:var(--accent-soft);color:var(--accent-text)}
.tb.drw{font-weight:600}
.tb .chev{width:12px;height:12px;stroke-width:2.2}
.tb:focus-visible{outline-offset:-2px}
.tsep{width:1px;height:22px;background:var(--line);margin:0 5px;flex-shrink:0}
.tools.fit1 .h1,.tools.fit2 .h2{display:none}
.search-tile{display:flex;align-items:center;gap:9px;padding:0 12px 0 14px;border:0;color:var(--text)}
.search-tile:hover{background:var(--surface-2)}
.search-tile kbd,.pal-field kbd{border:0;background:var(--surface-2);color:var(--text-2);font:500 11.5px/1 var(--mono);padding:4px 6px;border-radius:5px}
.primary-tile{--fold:rgba(255,255,255,.55);display:flex;align-items:center;gap:8px;padding:0 22px 0 16px;border:0;background:var(--accent);color:#fff;font-weight:700;font-size:14px;white-space:nowrap}
.primary-tile:hover{background:var(--accent-strong)}
.bar :focus-visible{outline-color:var(--focus)}
/* Cassetti: le categorie si aprono sopra il lavoro e si richiudono dopo il comando. */
.drawer{position:fixed;z-index:60;padding:var(--gap);background:var(--grout-deep);border-radius:12px;box-shadow:var(--lift);max-width:calc(100vw - 16px);max-height:calc(100dvh - 76px);overflow:auto}
.drawer-grid{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(196px,max-content));gap:var(--gap)}
.dgroup{background:var(--surface);border-radius:9px;padding:10px 6px 6px;display:flex;flex-direction:column;gap:1px;min-width:0}
.dgroup h3{margin:0;padding:0 8px 5px;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text-3)}
.ditem{display:flex;align-items:center;gap:10px;width:100%;min-height:34px;border:0;border-radius:7px;background:transparent;color:var(--text);padding:0 8px;text-align:left}
.ditem:hover{background:var(--hover)}
.ditem:focus-visible{background:var(--accent-soft);color:var(--accent-text);outline-offset:-2px}
.ditem .ico{color:var(--text-2)}.ditem:focus-visible .ico{color:inherit}
.ditem .lbl{flex:1;min-width:0}
.ditem kbd{border:0;background:var(--surface-2);color:var(--text-2);font:500 11px/1 var(--mono);padding:4px 5px;border-radius:5px}
.ditem .dstate{width:16px;text-align:center;font-weight:700;color:var(--accent-text)}
.ditem[aria-pressed=true] .dstate::before{content:'✓'}
.ditem[aria-pressed=true]{font-weight:600}
.dsel{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:36px;padding:0 4px 0 8px;color:var(--text-2)}
.dcolor{display:flex;align-items:center;gap:6px;min-height:36px;padding:0 4px;color:var(--text-2)}
.tool{display:inline-flex;justify-content:center;align-items:center;gap:5px;position:relative;height:30px;min-width:30px;padding:0 6px;border:1px solid transparent;border-radius:6px;background:transparent;color:var(--text);white-space:nowrap}
.tool:hover{background:var(--hover)}.tool:active{background:var(--pressed)}
.tool[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-text)}
.tool.lg{flex-direction:column;justify-content:flex-start;height:70px;min-width:54px;max-width:98px;padding:6px 6px 4px;white-space:normal;font-size:12px;line-height:1.2;gap:5px;text-align:center}
.tool.lg .ico{width:26px;height:26px;stroke-width:1.5}
.tool.lg .ti-text{font-size:21px;height:26px;display:flex;align-items:center;justify-content:center}
.tool .lbl{font-size:12px}
.tool.lg .chev,.chev{width:10px;height:10px;display:inline-block;vertical-align:middle;margin-left:2px;stroke-width:2}
.lgsplit{display:inline-flex;align-items:stretch}
.lgsplit .tool.lg{border-top-right-radius:0;border-bottom-right-radius:0;padding-right:4px}
.tool.drop{height:70px;min-width:16px;width:18px;padding:0;border-top-left-radius:0;border-bottom-left-radius:0}
.tool.drop .ico{width:12px;height:12px}
.lgsplit:hover .tool{border-color:var(--line)}
.tool[aria-expanded=true]{background:var(--pressed)}
.rb-select{height:28px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);color:var(--text);padding:0 4px}
.rb-select:hover{border-color:var(--text-3)}
.split{display:inline-flex;align-items:center}
.split .tool{padding:0 4px 4px 6px}
.swatch{position:absolute;left:7px;right:5px;bottom:4px;height:4px;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.2)}
.pick{position:relative;width:16px;height:30px;display:inline-grid;place-items:center;border-radius:6px;color:var(--text-2)}
.pick:hover{background:var(--hover)}
.pick input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0}
.pick:focus-within{outline:2px solid var(--focus);outline-offset:1px}
.pick .ico{width:12px;height:12px}
.style-card{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:4px;flex-shrink:0;width:88px;height:64px;padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--text-3);font-size:11px;text-align:left;overflow:hidden}
.style-card:hover{background:var(--accent-soft);border-color:var(--accent)}
.style-card[aria-pressed=true]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.style-card .sample{color:var(--text);font-family:Calibri,'Segoe UI',sans-serif;font-size:14px;white-space:nowrap}
.style-card .sample.h1{font-size:17px;color:var(--accent-text);font-weight:600}
.style-card .sample.h2{font-size:15px;color:var(--accent-text);font-weight:600}
.style-card .sample.h3{font-size:14px;color:var(--accent-text);font-weight:600}
.style-card .sample.q{font-style:italic;color:var(--text-2)}
/* Trova e sostituisci */
.findbar{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;padding:8px 14px;background:var(--surface);border-radius:var(--r);margin:var(--gap) var(--gap) 0;flex-shrink:0}
.findbar label{font-weight:600;font-size:12px}
.findbar input[type=search],.findbar input[type=text]{height:30px;width:200px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);color:var(--text);padding:0 8px}
.find-count{min-width:84px;color:var(--text-2);font-size:12px}
.btn{display:inline-flex;justify-content:center;align-items:center;gap:6px;height:30px;padding:0 12px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);color:var(--text);white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.primary{color:#fff;font-weight:600;background:var(--accent);border-color:var(--accent)}
.btn.primary:hover{background:var(--accent-strong)}
.btn.icon{width:30px;padding:0}
.check{display:inline-flex;align-items:center;gap:6px;font-weight:400!important}
.check input{width:16px;height:16px;accent-color:var(--accent)}
/* Area di lavoro */
.main{flex:1;min-height:0;display:flex;flex-direction:column;position:relative;padding:var(--gap) var(--gap) 0}
/* Riquadri laterali: si riducono a tessera, si spostano a destra o a sinistra, si allargano trascinando la fuga. */
.pane{width:var(--w,270px);flex-shrink:0;display:flex;flex-direction:column;min-height:0;min-width:0}
.pane-head{display:flex;align-items:center;gap:4px;padding:8px 6px 4px 14px;min-height:40px}.pane-head h2{font-size:14px;margin:0;flex:1}
.pane-btn{width:30px;height:30px;border:0;border-radius:7px;background:transparent;color:var(--text-2);display:grid;place-items:center;flex-shrink:0;padding:0}
.pane-btn:hover{background:var(--hover);color:var(--text)}.pane-btn[aria-expanded=true]{background:var(--pressed)}
.pane-btn .ico{width:16px;height:16px}
.tessera{width:44px;flex-shrink:0;border:0;border-radius:var(--r);background:var(--surface);color:var(--text);display:flex;flex-direction:column;align-items:center;gap:12px;padding:12px 0}
.tessera:hover{background:var(--surface-2)}
.tessera[data-side=left]{margin-right:var(--gap)}.tessera[data-side=right]{margin-left:var(--gap)}
.tessera .badge{min-width:20px;height:20px;padding:0 5px;border-radius:6px;background:var(--accent);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center}
.tessera .badge:empty{display:none}
.tessera .vt{writing-mode:vertical-rl;transform:rotate(180deg);font-weight:600;white-space:nowrap}
.sep{flex:0 0 var(--gap);align-self:stretch;display:grid;place-items:center;cursor:col-resize;touch-action:none;border-radius:4px}
.sep::before{content:'';width:4px;height:40px;max-height:60%;border-radius:2px;background:var(--accent);opacity:0;transition:opacity .12s}
.sep:hover::before,.sep:focus-visible::before,.sep.dragging::before{opacity:1}
.sep:focus-visible{outline-offset:0}
.sep.h{cursor:row-resize}.sep.h::before{width:40px;height:4px;max-width:60%}
@media (forced-colors:active){.sep::before{background:Highlight}}
.main:focus-visible{outline-offset:-3px}
.editor-pane{display:flex;flex-direction:column;flex:1;min-height:0;min-width:0}
.word-scroll{order:100;background:transparent;overflow:auto;flex:1;padding:28px 18px 90px}
.page{width:794px;min-height:1123px;margin:0 auto;background:#fff;color:#171717;box-shadow:0 1px 3px rgba(0,0,0,.14),0 8px 24px rgba(0,0,0,.10);zoom:var(--zoom);position:relative;border-radius:2px}
.page[data-paper=letter]{width:816px;min-height:1056px}
.page[data-paper=a4-landscape]{width:1123px;min-height:794px}
.page[data-paper=letter-landscape]{width:1056px;min-height:816px}
.page:focus-within{box-shadow:0 0 0 2px var(--accent),0 8px 24px rgba(0,0,0,.14)}
.word-content{--doc-font:Calibri,'Segoe UI',Arial,sans-serif;--doc-line:1.15;--doc-space:8pt;padding:96px 94px;min-height:inherit;outline:0;line-height:var(--doc-line);overflow-wrap:break-word;font-family:var(--doc-font);font-size:11pt;color:#171717;caret-color:#000}
.word-content.empty>:first-child::before{content:attr(data-placeholder);color:#6e6e6e;pointer-events:none}
.word-content p,.word-content div{margin:0 0 var(--doc-space)}
.word-content h1{font-size:20pt;margin:14px 0 8px;color:#1f3864;font-weight:600}
.word-content h2{font-size:15pt;margin:12px 0 6px;color:#2f5496;font-weight:600}
.word-content h3{font-size:12.5pt;margin:10px 0 5px;color:#2f5496;font-weight:600}
.word-content ul,.word-content ol{padding-left:32px;margin:0 0 var(--doc-space)}
.word-content table{min-width:120px;max-width:100%;margin:10px 0;border-collapse:collapse}
.word-content td,.word-content th{vertical-align:top;min-width:48px;padding:5px 8px;border:1px solid #8c8c8c}
.word-content th{background:#f2f2f2;text-align:left;font-weight:600}
.word-content img{max-width:100%;height:auto}
.word-content img:focus,.word-content img::selection{outline:2px solid var(--accent)}
.word-content a{text-decoration:underline;color:#0563c1}
.word-content blockquote{border-left:3px solid #8eaadb;padding:6px 16px;margin:0 0 var(--doc-space) 0;font-style:italic;color:#404040}
.word-content hr{border:0;border-top:1px solid #9a9a9a;margin:14px 0}
.word-content hr.pagebreak{position:relative;margin:28px -40px;border-top:2px dashed #8d9db6;break-after:page}
.word-content hr.pagebreak::after{position:absolute;left:50%;top:-10px;transform:translateX(-50%);content:'Interruzione di pagina';padding:0 8px;background:#fff;color:#555;font:11px 'Segoe UI',sans-serif}
.word-content .toc{border:1px dashed #b4c0d3;border-radius:4px;padding:8px 12px;margin-bottom:12px}
.word-content .toc p{margin:0 0 3px}
.word-content .footnotes{font-size:9.5pt;color:#333;margin-top:24px}
.word-content sup.fn{color:#0f4394;font-weight:600}
.word-content hr.sect{border:0;border-top:3px double #7d8fb3;position:relative;margin:30px -40px;overflow:visible}

@media print{.page.has-psec #wordEditor{display:none!important}.page.has-psec .print-sect{display:block!important}.word-content span.cc{border:0!important;background:none!important;padding:0!important;outline:0!important}.word-content span.cc-drop::after{content:''!important}.word-content :is(.tof,.idx,.biblio){border:0!important;padding:0!important}.word-content :is(a.xref,a.cite){background:none!important;border:0!important}.word-content .textbox{break-inside:avoid}}

/* Excel */
#excelPane{gap:var(--gap)}
.formula-line{display:flex;align-items:center;gap:6px;padding:6px 8px;background:var(--surface);border-radius:var(--r);flex-shrink:0}
.namebox{width:100px;height:28px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);color:var(--text);padding:0 8px;font-weight:600}
.fx{color:var(--text-3);font-style:italic;font-family:Georgia,serif;font-size:15px;padding:0 8px;border-left:1px solid var(--line);border-right:1px solid var(--line)}
#formulaInput{flex:1;min-width:0;height:28px;border:1px solid var(--line-strong);border-radius:6px;padding:0 9px;background:var(--surface);color:var(--text)}
.grid-area{display:flex;flex-direction:column;flex:1;min-height:0;position:relative;background:var(--surface);border-radius:var(--r);overflow:hidden}
.grid-scroll{position:relative;flex:1;overflow:auto;scrollbar-gutter:stable;background:#fff}

.sheetgrid{zoom:var(--zoom);width:max-content;table-layout:fixed;border-collapse:separate;border-spacing:0;color:#1b1b1b;font-size:12px;font-family:Calibri,'Segoe UI',Arial,sans-serif}

.sheetgrid thead th{z-index:4;position:sticky;top:0;height:27px;border-bottom:1px solid var(--line-strong);border-right-color:var(--line);background:var(--hdr);color:var(--text-2);font-weight:400;text-align:center;cursor:pointer;user-select:none}
.sheetgrid th.corner{left:0;z-index:7;width:44px}
.sheetgrid th.rowhead{position:sticky;left:0;z-index:3;width:44px;border-right:1px solid var(--line-strong);border-bottom-color:var(--line);background:var(--hdr);color:var(--text-2);font-weight:400;text-align:center;cursor:pointer;user-select:none}
.sheetgrid .selected-head{background:var(--accent-soft)!important;color:var(--accent-text)!important;font-weight:600!important}
.sheetgrid thead th.selected-head{box-shadow:inset 0 -2px 0 var(--accent)}

.sheetgrid td.num{text-align:right}
.sheetgrid td.sel{background-image:linear-gradient(var(--sel-tint),var(--sel-tint))}
.sheetgrid td.active{outline:2px solid var(--accent);outline-offset:-2px;z-index:2}
.sheetgrid td.err{color:#b10e1c;font-weight:600}
.sheetgrid td.wrap{white-space:pre-wrap;overflow:hidden}
.sheetgrid td.merged-anchor{vertical-align:middle}
.sheetgrid.nogrid td{border-color:transparent}
.sheetgrid td.spill::after{content:'';position:absolute;inset:0;pointer-events:none;border:0 dashed var(--accent)}
.sheetgrid td.sp-t::after{border-top-width:2px}.sheetgrid td.sp-b::after{border-bottom-width:2px}.sheetgrid td.sp-l::after{border-left-width:2px}.sheetgrid td.sp-r::after{border-right-width:2px}
.sheetgrid td.sp-x::after{border-color:#c50f1f}
#formulaInput.ghost{color:var(--text-3);font-style:italic}
.spacerrow td{height:0;max-height:none;padding:0;background:transparent;border:0!important;pointer-events:none}
.grid-input{display:none;position:fixed;z-index:100;min-width:130px;min-height:24px;padding:2px 6px;border:2px solid var(--accent);outline:none;box-shadow:0 4px 14px rgba(0,0,0,.2);background:#fff;color:#111;font:12px Calibri,'Segoe UI',Arial;white-space:pre;overflow:visible}
.sheet-bar{height:38px;display:flex;align-items:stretch;background:var(--surface);border-radius:var(--r);flex-shrink:0;padding:0 8px;gap:6px}
.sheet-tabs{display:flex;align-items:stretch;gap:2px;overflow-x:auto;scrollbar-width:thin}
.sheet-tab{border:0;background:transparent;color:var(--text-2);padding:0 16px;white-space:nowrap;font-size:12px;position:relative}

.print-sheet{display:none}

.chart-preview{border:1px solid var(--line);border-radius:8px;background:#fff;min-height:150px;margin:4px 0 6px;overflow:hidden}.chart-preview svg{display:block;width:100%;height:auto}
