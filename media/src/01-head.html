<style>
/* Mosaico: la finestra è fatta di tasselli (--surface) appoggiati su una fuga (--grout) che prende il colore dell'app. */
:root{--accent:#b35500;--accent-strong:#8a4100;--accent-text:#8a4100;--accent-soft:#fbebdd;--sel-tint:rgba(179,85,0,.18);
--grout:#ede2d8;--grout-deep:#e0d1c3;--gap:8px;--r:10px;--fold:var(--accent);--scrim:rgba(16,22,34,.16);--stage:#1c1e22;
--bg:var(--grout);--chrome:#fff;--surface:#fff;--surface-2:#f1f3f7;--hover:#e9edf3;--pressed:#dde2ea;--line:#e1e5ec;--line-strong:#a9b0bc;--text:#161b26;--text-2:#3e4757;--text-3:#596374;--canvas:#f1f3f7;--focus:#161b26;--danger:#b10e1c;
--wave-bg:#ffffff;--wave:#8a4100;--wave-rms:#d9893f;--wave-mid:#d0d0d0;--wave-sel:rgba(179,85,0,.22);--playhead:#c50f1f;--marker:#2457c5;--ruler:#596374;
--shadow:0 12px 32px rgba(20,24,34,.18),0 2px 8px rgba(20,24,34,.08);--lift:0 18px 40px rgba(20,24,34,.26),0 2px 6px rgba(20,24,34,.1);color-scheme:light;
--mono:'Cascadia Mono',Consolas,ui-monospace,'Courier New',monospace;
font-family:'Segoe UI Variable Text','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;font-size:13px;color:var(--text)}
html[data-mode=video]{--accent:#7a3db8;--accent-strong:#5e2c91;--accent-text:#5e2c91;--accent-soft:#f1e9fa;--sel-tint:rgba(122,61,184,.18);--grout:#e4dded;--grout-deep:#d6cce4}
html[data-theme=dark]{color-scheme:dark;--grout:#17110c;--grout-deep:#0d0906;--scrim:rgba(0,0,0,.45);--chrome:#1e2026;--surface:#1e2026;--surface-2:#272a31;--hover:#2f333c;--pressed:#3a3f49;--line:#363a44;--line-strong:#6b7280;--text:#eef1f6;--text-2:#c9d0db;--text-3:#a3acbb;--canvas:#16181d;--focus:#fff;--accent-text:#f2a05a;--accent-soft:#3a2410;
--wave-bg:#1a1c21;--wave:#f2a05a;--wave-rms:#a35a1c;--wave-mid:#444;--wave-sel:rgba(242,160,90,.25);--playhead:#ff6b6b;--marker:#9bbcf5;--ruler:#a3acbb;--shadow:0 12px 32px rgba(0,0,0,.55);--lift:0 18px 40px rgba(0,0,0,.6)}
html[data-theme=dark][data-mode=video]{--accent-text:#c19af0;--accent-soft:#2c1d40;--grout:#120e18;--grout-deep:#0a070e}
html[data-contrast=high]{--grout:#fff;--grout-deep:#fff;--line:#000;--line-strong:#000;--text-2:#000;--text-3:#111;--hover:#cfcfcf;--accent-text:#5c2b00;--wave:#000;--wave-rms:#5c2b00;--wave-mid:#000;--wave-sel:rgba(0,0,0,.2);--playhead:#b10e1c;--marker:#002a66;--ruler:#000}
html[data-contrast=high][data-mode=video]{--accent-text:#3d1a63}
html[data-contrast=high][data-theme=dark]{--grout:#000;--grout-deep:#000;--line:#fff;--line-strong:#fff;--text-2:#fff;--text-3:#fff;--hover:#4a4a4a;--accent-text:#ffc48f;--wave:#fff;--wave-rms:#ffc48f;--wave-mid:#fff;--wave-sel:rgba(255,255,255,.28);--playhead:#ff8080;--marker:#b5d0ff;--ruler:#fff}
html[data-contrast=high][data-theme=dark][data-mode=video]{--accent-text:#dcc2ff}
@media (forced-colors:active){:root{--wave-bg:Canvas;--wave:CanvasText;--wave-rms:CanvasText;--wave-mid:GrayText;--wave-sel:Highlight;--playhead:Highlight;--marker:LinkText;--ruler:CanvasText}}
html[data-contrast=high] .tb,html[data-contrast=high] .ditem,html[data-contrast=high] .btn,html[data-contrast=high] .tp-btn{border:1px solid var(--line-strong)}
/* In contrasto elevato la fuga diventa una linea di 2 px intorno a ogni tassello. */
html[data-contrast=high] .tile{outline:2px solid var(--line-strong);outline-offset:-2px}
html[data-contrast=high] .tessera,html[data-contrast=high] .chip,html[data-contrast=high] .st-btn{box-shadow:inset 0 0 0 2px var(--line-strong)}
html[data-contrast=high] :focus-visible{outline-width:3px}
@media (forced-colors:active){.tile,.tessera,.chip,.st-btn,.drawer,.dgroup,.palette,.pal-field,#palList{border:1px solid CanvasText}}
*,*::before,*::after{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--text)}
[hidden],.hidden{display:none!important}
button,select,input,textarea{color:inherit;font:inherit}
button{cursor:pointer}button:disabled,[aria-disabled=true]{opacity:.45;cursor:not-allowed}
:focus{outline:none}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
kbd{font:600 11px/1 'Segoe UI',system-ui,sans-serif;display:inline-block;padding:3px 6px;border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:4px;background:var(--surface);color:var(--text-2);white-space:nowrap}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:fixed;left:10px;top:-80px;z-index:1000;background:var(--surface);color:var(--text);padding:10px 16px;border-radius:8px;box-shadow:var(--shadow);font-weight:600;text-decoration:none}
.skip:focus{top:10px}
.ico{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;display:block}
.ti-text{font-weight:600;font-size:15px;line-height:1;min-width:18px;text-align:center;font-family:'Segoe UI',system-ui,sans-serif;white-space:nowrap}
#app{display:flex;flex-direction:column;height:100dvh;min-width:0}
/* Tasselli e angolo: l'angolo piegato del logo segna l'azione principale e il tassello in cui si lavora. */
.tile{background:var(--surface);border-radius:var(--r);position:relative}
.primary-tile::after,.tile.is-active::after,.pal-field::after{content:'';position:absolute;top:0;right:0;width:14px;height:14px;border-bottom-left-radius:4px;background:linear-gradient(to bottom left,var(--corner-bg,var(--grout)) 50%,var(--fold) 50%);pointer-events:none;z-index:8}
/* Barra: una riga di tasselli al posto di titolo, schede e barra multifunzione. */
.bar{display:flex;align-items:stretch;gap:var(--gap);padding:var(--gap) var(--gap) 0;flex-shrink:0;position:relative;z-index:30;min-width:0}
.bar>.tile{height:48px;flex:0 0 auto}
.brand-tile{display:flex;align-items:center;gap:4px;padding:0 6px}
.brand{width:38px;height:38px;border:0;border-radius:8px;background:transparent;display:grid;place-items:center;padding:0}
.brand:hover{background:var(--hover)}
.brand-mark{width:24px;height:24px;flex:none}
.app-switch{display:flex;gap:2px;padding:3px;border-radius:9px;background:var(--surface-2)}
.app-switch button{display:flex;align-items:center;gap:7px;height:32px;padding:0 10px 0 6px;border:0;border-radius:7px;background:transparent;color:var(--text-2);font-weight:600}
.app-switch button:hover{background:var(--hover);color:var(--text)}
.app-switch button[aria-pressed=true]{background:var(--surface);color:var(--accent-text);box-shadow:0 1px 3px rgba(20,24,34,.16)}
.app-logo{width:20px;height:20px;border-radius:5px;display:grid;place-items:center;background:var(--pressed);color:var(--text-2)}
.app-logo svg{display:block}
.app-switch button[aria-pressed=true] .app-logo{background:var(--accent);color:#fff}
.doc-tile{display:flex;flex-direction:column;justify-content:center;gap:1px;padding:0 12px 0 14px;min-width:120px}
.bar>.doc-tile{flex:0 1 220px}
.doc-tile input{width:100%;min-width:0;height:24px;margin-left:-6px;padding:0 5px;border:1px solid transparent;border-radius:6px;background:transparent;color:var(--text);font-weight:700;font-size:14px}
.doc-tile input:hover{border-color:var(--line-strong)}
.doc-tile input:focus{background:var(--surface-2)}
.save-state{font-size:12px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{min-width:0;display:flex;align-items:center;gap:2px;padding:0 6px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.bar>.tools{flex:1 1 0}
.bar.wrap{flex-wrap:wrap}.bar.wrap>.tools{order:9;flex:1 1 100%;scrollbar-width:thin}.bar.wrap>.doc-tile{flex:1 1 160px}
.tools>div{display:flex;align-items:center;gap:2px;flex-shrink:0}
.tb{flex-shrink:0;height:36px;min-width:36px;border:0;border-radius:8px;background:transparent;color:var(--text);display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:0 9px;white-space:nowrap}
.tb.icon{width:36px;padding:0}
.tb:hover{background:var(--hover)}.tb:active{background:var(--pressed)}
.tb[aria-pressed=true],.tb[aria-expanded=true]{background:var(--accent-soft);color:var(--accent-text)}
.tb.drw{font-weight:600}
.tb .chev{width:12px;height:12px;stroke-width:2.2}
.tb:focus-visible{outline-offset:-2px}
.tsep{width:1px;height:22px;background:var(--line);margin:0 5px;flex-shrink:0}
.tools.fit1 .h1,.tools.fit2 .h2{display:none}
.search-tile{display:flex;align-items:center;gap:9px;padding:0 12px 0 14px;border:0;color:var(--text)}
.search-tile:hover{background:var(--surface-2)}
.search-tile kbd,.pal-field kbd{border:0;background:var(--surface-2);color:var(--text-2);font:500 11.5px/1 var(--mono);padding:4px 6px;border-radius:5px}
.primary-tile{--fold:rgba(255,255,255,.55);display:flex;align-items:center;gap:8px;padding:0 22px 0 16px;border:0;background:var(--accent);color:#fff;font-weight:700;font-size:14px;white-space:nowrap}
.primary-tile:hover{background:var(--accent-strong)}
.bar :focus-visible{outline-color:var(--focus)}
/* Cassetti: le categorie si aprono sopra il lavoro e si richiudono dopo il comando. */
.drawer{position:fixed;z-index:60;padding:var(--gap);background:var(--grout-deep);border-radius:12px;box-shadow:var(--lift);max-width:calc(100vw - 16px);max-height:calc(100dvh - 76px);overflow:auto}
.drawer-grid{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(196px,max-content));gap:var(--gap)}
.dgroup{background:var(--surface);border-radius:9px;padding:10px 6px 6px;display:flex;flex-direction:column;gap:1px;min-width:0}
.dgroup h3{margin:0;padding:0 8px 5px;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text-3)}
.ditem{display:flex;align-items:center;gap:10px;width:100%;min-height:34px;border:0;border-radius:7px;background:transparent;color:var(--text);padding:0 8px;text-align:left}
.ditem:hover{background:var(--hover)}
.ditem:focus-visible{background:var(--accent-soft);color:var(--accent-text);outline-offset:-2px}
.ditem .ico{color:var(--text-2)}.ditem:focus-visible .ico{color:inherit}
.ditem .lbl{flex:1;min-width:0}
.ditem kbd{border:0;background:var(--surface-2);color:var(--text-2);font:500 11px/1 var(--mono);padding:4px 5px;border-radius:5px}
.ditem .dstate{width:16px;text-align:center;font-weight:700;color:var(--accent-text)}
.ditem[aria-pressed=true] .dstate::before{content:'✓'}
.ditem[aria-pressed=true]{font-weight:600}
.rb-select{height:28px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);color:var(--text);padding:0 4px}
.rb-select:hover{border-color:var(--text-3)}
.btn{display:inline-flex;justify-content:center;align-items:center;gap:6px;height:30px;padding:0 12px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);color:var(--text);white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.primary{color:#fff;font-weight:600;background:var(--accent);border-color:var(--accent)}
.btn.primary:hover{background:var(--accent-strong)}
.btn.icon{width:30px;padding:0}
.btn.sm{height:26px;padding:0 8px;font-size:12px}
.check{display:inline-flex;align-items:center;gap:6px;font-weight:400!important}
.check input{width:16px;height:16px;accent-color:var(--accent)}
/* Area di lavoro */
.main{flex:1;min-height:0;display:flex;flex-direction:column;position:relative;padding:var(--gap) var(--gap) 0}
.main:focus-visible{outline-offset:-3px}
.editor-pane{display:flex;flex-direction:column;flex:1;min-height:0;min-width:0}
/* Trasporto: riproduzione, registrazione e orologio */
.transport{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;padding:6px 10px;background:var(--surface);flex-shrink:0}
#aTransport{border-radius:var(--r)}
.tp-group{display:flex;align-items:center;gap:3px}
.tp-btn{width:36px;height:36px;border:1px solid transparent;border-radius:50%;background:transparent;color:var(--text);display:grid;place-items:center}
.tp-btn:hover{background:var(--hover)}.tp-btn:active{background:var(--pressed)}
.tp-btn.main-play{width:42px;height:42px;background:var(--accent);color:#fff}
.tp-btn.main-play:hover{background:var(--accent-strong)}
.tp-btn[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-text)}
.tp-btn.rec{color:#c50f1f}
html[data-theme=dark] .tp-btn.rec{color:#ff7a7a}
.tp-btn .ico{width:20px;height:20px}
.clock{display:flex;flex-direction:column;align-items:flex-start;padding:3px 10px;background:var(--surface-2);border-radius:8px;min-width:150px}
.clock b{font:600 20px/1.1 var(--mono);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.clock small{font-size:11px;color:var(--text-3)}
.meter{width:150px;height:14px;display:block;border-radius:3px;background:var(--surface-2);border:1px solid var(--line)}
.tp-info{font-size:12px;color:var(--text-2);display:flex;flex-direction:column;gap:2px}
.tp-sel{display:flex;align-items:center;gap:6px}
.tp-sel label{font-size:12px;color:var(--text-2)}
/* Editor audio */
#audioPane{flex-direction:row}
.wave-col{display:flex;flex-direction:column;gap:var(--gap);flex:1;min-width:0;min-height:0;order:100}
.wave-wrap{flex:1;display:flex;flex-direction:column;min-height:0;background:var(--canvas);padding:8px 10px;gap:4px}
.ruler{height:24px;flex-shrink:0;position:relative}
.ruler canvas,.overview canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.wave-box{flex:1;position:relative;display:flex;min-height:140px}
.wave{flex:1;position:relative;min-height:140px;border-radius:6px;background:var(--wave-bg);box-shadow:0 1px 3px rgba(0,0,0,.14);cursor:text;touch-action:none;forced-color-adjust:none}
.wave canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px}
.wave:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wave:focus-visible::after{content:attr(data-focus-hint);position:absolute;right:8px;top:6px;font-size:11px;background:var(--surface);color:var(--text-2);padding:2px 7px;border-radius:6px;border:1px solid var(--line);pointer-events:none}
.overview{height:30px;flex-shrink:0;position:relative;border-radius:5px;background:var(--wave-bg);cursor:pointer;forced-color-adjust:none}
.wave-empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px;color:var(--text-2);pointer-events:none}
.wave-empty b{display:block;font-size:17px;color:var(--text);margin-bottom:6px}
.wave-empty .row{display:flex;gap:8px;justify-content:center;margin-top:12px;pointer-events:auto;flex-wrap:wrap}
.selbar{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 14px;padding:7px 10px;background:var(--surface);border-top:1px solid var(--line);flex-shrink:0;border-radius:0 0 var(--r) var(--r)}
.selbar .fld{display:flex;flex-direction:column;gap:2px}
.selbar label{font-size:11.5px;color:var(--text-2);font-weight:600}
.timefield{width:118px;height:28px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);color:var(--text);padding:0 8px;font:13px 'Cascadia Mono',Consolas,'Courier New',monospace;font-variant-numeric:tabular-nums}
.selbar output{display:block;height:28px;line-height:28px;font:13px 'Cascadia Mono',Consolas,monospace;color:var(--text-2)}
/* Tracce del progetto audio e editor della regione */
#audioPane .wave-col{min-height:0}
.arrange{flex:1 1 55%;min-height:140px;display:flex;flex-direction:column;background:var(--surface);position:relative;overflow:hidden}
.ar-bar,.ed-bar{display:flex;align-items:center;gap:8px;padding:6px 10px 6px 14px;min-height:40px;flex-shrink:0;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.ar-bar h2,.ed-bar h2{font-size:14px;margin:0}
.ar-bar .grow,.ed-bar .grow{flex:1}
.ar-scroll{flex:1;min-height:0;overflow:auto;position:relative;scrollbar-width:thin}
.ar-inner{position:relative;min-width:100%}
.ar-row{display:flex;height:66px;border-bottom:1px solid var(--line)}
.ar-rulerrow{height:26px;position:sticky;top:0;z-index:7;background:var(--surface)}
.ar-head{position:sticky;left:0;z-index:5;width:240px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--line);display:grid;grid-template-columns:6px minmax(0,1fr) auto auto auto;grid-template-rows:auto auto;gap:3px 4px;align-items:center;padding:4px 6px 4px 0}
.ar-head.sel{background:var(--accent-soft)}
.ar-corner{display:flex;align-items:center;padding:0 12px;font-size:12px;color:var(--text-3)}
.trk-color{grid-row:1/3;align-self:stretch;background:var(--tc);border-radius:0 3px 3px 0;forced-color-adjust:none}
.trk-name{border:0;background:transparent;text-align:left;font-weight:600;font-size:12.5px;padding:2px 5px;border-radius:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text);min-width:0}
.trk-name:hover{background:var(--hover)}
.trk-btn{width:26px;height:22px;border:1px solid var(--line-strong);border-radius:5px;background:var(--surface);font-size:11px;font-weight:700;padding:0;color:var(--text-2);display:grid;place-items:center}
.trk-btn:hover{background:var(--hover)}.trk-btn .ico{width:14px;height:14px}
.trk-btn.m[aria-pressed=true]{background:#8a6d00;border-color:#8a6d00;color:#fff}
.trk-btn.s[aria-pressed=true]{background:#2457c5;border-color:#2457c5;color:#fff}
.trk-sliders{grid-column:2/6;display:flex;gap:8px;align-items:center;padding-left:4px}
.trk-sliders input{width:50%;min-width:0;accent-color:var(--tc)}
.ar-lane{position:relative;flex:1;min-width:0}
.ar-lane:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.ar-lane:focus-visible .item.active{outline:3px solid var(--focus);outline-offset:1px}
.ar-row.sel .ar-lane{background:color-mix(in srgb,var(--accent) 6%,transparent)}
.item.k-region{background:color-mix(in srgb,var(--rc) 78%,#000);border-color:color-mix(in srgb,var(--rc) 60%,#000);padding:2px 6px}
.item.k-region canvas{position:absolute;inset:16px 0 2px;width:100%;height:calc(100% - 18px);opacity:.9;pointer-events:none}
.item.k-region .rg-name{position:relative;z-index:1;font-weight:600}
.item .edge{position:absolute;top:0;bottom:0;width:7px;cursor:ew-resize;z-index:2}.item .edge.l{left:0}.item .edge.r{right:0}
.item.missing{background:repeating-linear-gradient(135deg,#555 0 6px,#444 6px 12px)}
.ar-ruler{position:relative;flex:1;cursor:pointer;background:var(--surface)}
.ar-ruler canvas{position:absolute;left:0;top:0;height:100%;display:block}
.ar-cycle{position:absolute;top:0;height:9px;background:var(--accent);opacity:.6;border-radius:0 0 3px 3px;pointer-events:none}
.ar-line{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--playhead);pointer-events:none;z-index:6}
.ar-empty{position:absolute;left:0;right:0;top:80px;bottom:0;display:grid;place-items:center;text-align:center;padding:16px;color:var(--text-2);pointer-events:none}
.ar-empty b{display:block;font-size:16px;color:var(--text);margin-bottom:6px}
