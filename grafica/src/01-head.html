<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='46' height='46' rx='10' fill='%232457C5'/%3E%3Cpath d='M64 0H86L100 14V36Q100 46 90 46H64Q54 46 54 36V10Q54 0 64 0Z' fill='%231E7A46'/%3E%3Cpath d='M86 0V8Q86 14 92 14H100Z' fill='%23fff' fill-opacity='.55'/%3E%3Crect y='54' width='46' height='46' rx='10' fill='%23B35500'/%3E%3Crect x='54' y='54' width='46' height='46' rx='10' fill='%237A3DB8'/%3E%3C/svg%3E">
<style>
/* Mosaico: la finestra è fatta di tasselli (--surface) appoggiati su una fuga (--grout) che prende il colore dell'app. */
:root{--accent:#b0306a;--accent-strong:#8c2453;--accent-text:#8c2453;--accent-soft:#fbeaf2;--sel-tint:rgba(176,48,106,.18);
--grout:#eddde5;--grout-deep:#e0cad5;--gap:8px;--r:10px;--fold:var(--accent);--scrim:rgba(16,22,34,.16);
--bg:var(--grout);--chrome:#fff;--surface:#fff;--surface-2:#f1f3f7;--hover:#e9edf3;--pressed:#dde2ea;--line:#e1e5ec;--line-strong:#a9b0bc;--text:#161b26;--text-2:#3e4757;--text-3:#596374;--canvas:#e4e5e7;--focus:#161b26;--danger:#b10e1c;
--hist-bg:#ffffff;--hist-l:#6b6b6b;--hist-r:#d13438;--hist-g:#2e8b3d;--hist-b:#2f6fd6;--hist-clip:#c50f1f;
--shadow:0 12px 32px rgba(20,24,34,.18),0 2px 8px rgba(20,24,34,.08);--lift:0 18px 40px rgba(20,24,34,.26),0 2px 6px rgba(20,24,34,.1);color-scheme:light;
--mono:'Cascadia Mono',Consolas,ui-monospace,'Courier New',monospace;
font-family:'Segoe UI Variable Text','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;font-size:13px;color:var(--text)}
html[data-theme=dark]{color-scheme:dark;--grout:#170e13;--grout-deep:#0d070a;--scrim:rgba(0,0,0,.45);--chrome:#1e2026;--surface:#1e2026;--surface-2:#272a31;--hover:#2f333c;--pressed:#3a3f49;--line:#363a44;--line-strong:#6b7280;--text:#eef1f6;--text-2:#c9d0db;--text-3:#a3acbb;--canvas:#141518;--focus:#fff;--accent-text:#f59ac2;--accent-soft:#3f1a2c;
--hist-bg:#1a1c21;--hist-l:#bdbdbd;--hist-r:#ff7b7f;--hist-g:#6fd37f;--hist-b:#7fa8ff;--hist-clip:#ff6b6b;--shadow:0 12px 32px rgba(0,0,0,.55);--lift:0 18px 40px rgba(0,0,0,.6)}
html[data-contrast=high]{--grout:#fff;--grout-deep:#fff;--line:#000;--line-strong:#000;--text-2:#000;--text-3:#111;--hover:#cfcfcf;--accent-text:#5e1638;--hist-l:#000;--hist-clip:#b10e1c}
html[data-contrast=high][data-theme=dark]{--grout:#000;--grout-deep:#000;--line:#fff;--line-strong:#fff;--text-2:#fff;--text-3:#fff;--hover:#4a4a4a;--accent-text:#ffc2dc;--hist-l:#fff;--hist-clip:#ff8080}
@media (forced-colors:active){:root{--hist-bg:Canvas;--hist-l:CanvasText;--hist-r:CanvasText;--hist-g:CanvasText;--hist-b:CanvasText;--hist-clip:Highlight}}
html[data-mode=disegno]{--accent:#0e6f8a;--accent-strong:#0a5468;--accent-text:#0a5468;--accent-soft:#e3f2f6;--sel-tint:rgba(14,111,138,.18);--grout:#d9e8ec;--grout-deep:#c6dce2}
html[data-theme=dark][data-mode=disegno]{--accent-text:#7fd0e6;--accent-soft:#12303a;--grout:#0c1315;--grout-deep:#060b0d}
html[data-contrast=high][data-mode=disegno]{--accent-text:#063644;--grout:#fff;--grout-deep:#fff}
html[data-contrast=high][data-theme=dark][data-mode=disegno]{--accent-text:#b5e9f7;--grout:#000;--grout-deep:#000}
html[data-contrast=high] .tb,html[data-contrast=high] .ditem,html[data-contrast=high] .btn{border:1px solid var(--line-strong)}
/* In contrasto elevato la fuga diventa una linea di 2 px intorno a ogni tassello. */
html[data-contrast=high] .tile{outline:2px solid var(--line-strong);outline-offset:-2px}
html[data-contrast=high] .tessera,html[data-contrast=high] .chip,html[data-contrast=high] .st-btn{box-shadow:inset 0 0 0 2px var(--line-strong)}
html[data-contrast=high] :focus-visible{outline-width:3px}
@media (forced-colors:active){.tile,.tessera,.chip,.st-btn,.drawer,.dgroup,.palette,.pal-field,#palList{border:1px solid CanvasText}}
*,*::before,*::after{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--text)}
[hidden],.hidden{display:none!important}
button,select,input,textarea{color:inherit;font:inherit}
button{cursor:pointer}button:disabled,[aria-disabled=true]{opacity:.45;cursor:not-allowed}
:focus{outline:none}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
kbd{font:600 11px/1 'Segoe UI',system-ui,sans-serif;display:inline-block;padding:3px 6px;border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:4px;background:var(--surface);color:var(--text-2);white-space:nowrap}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:fixed;left:10px;top:-80px;z-index:1000;background:var(--surface);color:var(--text);padding:10px 16px;border-radius:8px;box-shadow:var(--shadow);font-weight:600;text-decoration:none}
.skip:focus{top:10px}
.ico{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;display:block}
.ti-text{font-weight:600;font-size:15px;line-height:1;min-width:18px;text-align:center;font-family:'Segoe UI',system-ui,sans-serif;white-space:nowrap}
#app{display:flex;flex-direction:column;height:100dvh;min-width:0}
/* Tasselli e angolo: l'angolo piegato del logo segna l'azione principale e il tassello in cui si lavora. */
.tile{background:var(--surface);border-radius:var(--r);position:relative}
.primary-tile::after,.tile.is-active::after,.pal-field::after{content:'';position:absolute;top:0;right:0;width:14px;height:14px;border-bottom-left-radius:4px;background:linear-gradient(to bottom left,var(--corner-bg,var(--grout)) 50%,var(--fold) 50%);pointer-events:none;z-index:8}
/* Barra: una riga di tasselli al posto di titolo, schede e barra multifunzione. */
.bar{display:flex;align-items:stretch;gap:var(--gap);padding:var(--gap) var(--gap) 0;flex-shrink:0;position:relative;z-index:30;min-width:0}
.bar>.tile{height:48px;flex:0 0 auto}
.brand-tile{display:flex;align-items:center;gap:4px;padding:0 6px}
.brand{width:38px;height:38px;border:0;border-radius:8px;background:transparent;display:grid;place-items:center;padding:0}
.brand:hover{background:var(--hover)}
.brand-mark{width:24px;height:24px;flex:none}
.app-switch{display:flex;gap:2px;padding:3px;border-radius:9px;background:var(--surface-2)}
.app-switch button{display:flex;align-items:center;gap:7px;height:32px;padding:0 10px 0 6px;border:0;border-radius:7px;background:transparent;color:var(--text-2);font-weight:600}
.app-switch button:hover{background:var(--hover);color:var(--text)}
.app-switch button[aria-pressed=true]{background:var(--surface);color:var(--accent-text);box-shadow:0 1px 3px rgba(20,24,34,.16)}
.app-logo{width:20px;height:20px;border-radius:5px;display:grid;place-items:center;background:var(--pressed);color:var(--text-2)}
.app-logo svg{display:block}
.app-switch button[aria-pressed=true] .app-logo{background:var(--accent);color:#fff}
.doc-tile{display:flex;flex-direction:column;justify-content:center;gap:1px;padding:0 12px 0 14px;min-width:120px}
.bar>.doc-tile{flex:0 1 220px}
.doc-tile input{width:100%;min-width:0;height:24px;margin-left:-6px;padding:0 5px;border:1px solid transparent;border-radius:6px;background:transparent;color:var(--text);font-weight:700;font-size:14px}
.doc-tile input:hover{border-color:var(--line-strong)}
.doc-tile input:focus{background:var(--surface-2)}
.save-state{font-size:12px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{min-width:0;display:flex;align-items:center;gap:2px;padding:0 6px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.bar>.tools{flex:1 1 0}
.bar.wrap{flex-wrap:wrap}.bar.wrap>.tools{order:9;flex:1 1 100%;scrollbar-width:thin}.bar.wrap>.doc-tile{flex:1 1 160px}
.tools>div{display:flex;align-items:center;gap:2px;flex-shrink:0}
.tb{flex-shrink:0;height:36px;min-width:36px;border:0;border-radius:8px;background:transparent;color:var(--text);display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:0 9px;white-space:nowrap}
.tb.icon{width:36px;padding:0}
.tb:hover{background:var(--hover)}.tb:active{background:var(--pressed)}
.tb[aria-pressed=true],.tb[aria-expanded=true]{background:var(--accent-soft);color:var(--accent-text)}
.tb.drw{font-weight:600}
.tb .chev{width:12px;height:12px;stroke-width:2.2}
.tb:focus-visible{outline-offset:-2px}
.tsep{width:1px;height:22px;background:var(--line);margin:0 5px;flex-shrink:0}
.tools.fit1 .h1,.tools.fit2 .h2{display:none}
.search-tile{display:flex;align-items:center;gap:9px;padding:0 12px 0 14px;border:0;color:var(--text)}
.search-tile:hover{background:var(--surface-2)}
.search-tile kbd,.pal-field kbd{border:0;background:var(--surface-2);color:var(--text-2);font:500 11.5px/1 var(--mono);padding:4px 6px;border-radius:5px}
.primary-tile{--fold:rgba(255,255,255,.55);display:flex;align-items:center;gap:8px;padding:0 22px 0 16px;border:0;background:var(--accent);color:#fff;font-weight:700;font-size:14px;white-space:nowrap}
.primary-tile:hover{background:var(--accent-strong)}
.bar :focus-visible{outline-color:var(--focus)}
/* Cassetti: le categorie si aprono sopra il lavoro e si richiudono dopo il comando. */
.drawer{position:fixed;z-index:60;padding:var(--gap);background:var(--grout-deep);border-radius:12px;box-shadow:var(--lift);max-width:calc(100vw - 16px);max-height:calc(100dvh - 76px);overflow:auto}
.drawer-grid{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(196px,max-content));gap:var(--gap)}
.dgroup{background:var(--surface);border-radius:9px;padding:10px 6px 6px;display:flex;flex-direction:column;gap:1px;min-width:0}
.dgroup h3{margin:0;padding:0 8px 5px;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text-3)}
.ditem{display:flex;align-items:center;gap:10px;width:100%;min-height:34px;border:0;border-radius:7px;background:transparent;color:var(--text);padding:0 8px;text-align:left}
.ditem:hover{background:var(--hover)}
.ditem:focus-visible{background:var(--accent-soft);color:var(--accent-text);outline-offset:-2px}
.ditem .ico{color:var(--text-2)}.ditem:focus-visible .ico{color:inherit}
.ditem .lbl{flex:1;min-width:0}
.ditem kbd{border:0;background:var(--surface-2);color:var(--text-2);font:500 11px/1 var(--mono);padding:4px 5px;border-radius:5px}
.ditem .dstate{width:16px;text-align:center;font-weight:700;color:var(--accent-text)}
.ditem[aria-pressed=true] .dstate::before{content:'✓'}
.ditem[aria-pressed=true]{font-weight:600}
.rb-select{height:28px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);color:var(--text);padding:0 4px}
.rb-select:hover{border-color:var(--text-3)}
.btn{display:inline-flex;justify-content:center;align-items:center;gap:6px;height:30px;padding:0 12px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);color:var(--text);white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.primary{color:#fff;font-weight:600;background:var(--accent);border-color:var(--accent)}
.btn.primary:hover{background:var(--accent-strong)}
.btn.icon{width:30px;padding:0}
.btn.sm{height:26px;padding:0 8px;font-size:12px}
.check{display:inline-flex;align-items:center;gap:6px;font-weight:400!important}
.check input{width:16px;height:16px;accent-color:var(--accent)}
/* Area di lavoro */
.main{flex:1;min-height:0;display:flex;flex-direction:column;position:relative;padding:var(--gap) var(--gap) 0}
.main:focus-visible{outline-offset:-3px}
.editor-pane{display:flex;flex-direction:column;flex:1;min-height:0;min-width:0}
.btn[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-text)}
/* Riquadri laterali: si riducono a tessera, si spostano a destra o a sinistra, si allargano trascinando la fuga. */
.pane{width:var(--w,270px);flex-shrink:0;display:flex;flex-direction:column;min-height:0;min-width:0}
.pane-head{display:flex;align-items:center;gap:4px;padding:8px 6px 4px 14px;min-height:40px}.pane-head h2{font-size:14px;margin:0;flex:1}
.pane-btn{width:30px;height:30px;border:0;border-radius:7px;background:transparent;color:var(--text-2);display:grid;place-items:center;flex-shrink:0;padding:0}
.pane-btn:hover{background:var(--hover);color:var(--text)}.pane-btn[aria-expanded=true]{background:var(--pressed)}
.pane-btn .ico{width:16px;height:16px}
.tessera{width:44px;flex-shrink:0;border:0;border-radius:var(--r);background:var(--surface);color:var(--text);display:flex;flex-direction:column;align-items:center;gap:12px;padding:12px 0}
.tessera:hover{background:var(--surface-2)}
.tessera[data-side=left]{margin-right:var(--gap)}.tessera[data-side=right]{margin-left:var(--gap)}
.tessera .badge{min-width:20px;height:20px;padding:0 5px;border-radius:6px;background:var(--accent);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center}
.tessera .badge:empty{display:none}
.tessera .vt{writing-mode:vertical-rl;transform:rotate(180deg);font-weight:600;white-space:nowrap}
.sep{flex:0 0 var(--gap);align-self:stretch;display:grid;place-items:center;cursor:col-resize;touch-action:none;border-radius:4px}
.sep::before{content:'';width:4px;height:40px;max-height:60%;border-radius:2px;background:var(--accent);opacity:0;transition:opacity .12s}
.sep:hover::before,.sep:focus-visible::before,.sep.dragging::before{opacity:1}
.sep:focus-visible{outline-offset:0}
.sep.h{cursor:row-resize}.sep.h::before{width:40px;height:4px;max-width:60%}
@media (forced-colors:active){.sep::before{background:Highlight}}
.pane-count{font-size:12px;color:var(--text-3)}
.pane-hint{font-size:12px;color:var(--text-3);margin:0 14px 8px;line-height:1.35}
.pane-tools{display:flex;flex-wrap:wrap;gap:4px;padding:0 12px 8px}
.lb{list-style:none;margin:0;padding:4px 6px 12px;overflow:auto;flex:1;min-height:0}
.lb:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.lb-item{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;font-size:13px;line-height:1.3;cursor:pointer;border:1px solid transparent}
.lb-item:hover{background:var(--hover)}
.lb-item[aria-selected=true]{background:var(--accent-soft);color:var(--accent-text);border-color:var(--accent)}
.lb:focus-visible .lb-item.active,.lb-item.active{box-shadow:inset 3px 0 0 var(--accent)}
.lb-item .t{font:12px 'Cascadia Mono',Consolas,monospace;color:var(--text-3);flex-shrink:0}
.lb-item[aria-selected=true] .t{color:inherit}
.lb-item .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-empty{padding:8px 10px;color:var(--text-3);font-size:12.5px}
.insp-body{overflow:auto;padding:0 14px 16px;flex:1;min-height:0}
.insp-body h3{font-size:13px;margin:14px 0 4px;color:var(--text-2)}
.insp-body label{display:block;margin:10px 0 3px;font-weight:600;font-size:12.5px}
.insp-body label.check{display:flex;margin-top:10px}
.insp-body input:not([type=checkbox]):not([type=range]):not([type=color]),.insp-body select,.insp-body textarea{width:100%;padding:6px 8px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);color:var(--text)}
.insp-body input[type=range]{width:100%;accent-color:var(--accent)}
.insp-body input[type=color]{width:52px;height:30px;padding:2px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface)}
.insp-body .row2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.insp-body .hint{display:block;color:var(--text-3);font-size:11.5px;margin-top:3px}
.insp-body dl{display:grid;grid-template-columns:max-content 1fr;gap:4px 12px;margin:8px 0 0}
.insp-body dt{color:var(--text-3)}.insp-body dd{margin:0;font-weight:600}
.insp-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
/* Barra di stato */
.status{flex-shrink:0;display:flex;align-items:center;gap:var(--gap);color:var(--text-2);font-size:12.5px;padding:var(--gap);min-width:0}
.status .grow{flex:1}
.chip{height:34px;border-radius:9px;background:var(--surface);display:inline-flex;align-items:center;gap:6px;padding:0 12px;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.chip:empty{display:none}
#statusText{display:block;line-height:34px;flex:0 1 auto}
.st-btn{border:0;background:var(--surface);color:var(--text-2);height:34px;padding:0 12px;border-radius:9px;display:inline-flex;align-items:center;gap:7px;flex-shrink:0;white-space:nowrap}
.st-btn:hover{background:var(--surface-2);color:var(--text)}
.st-btn[aria-expanded=true]{background:var(--accent-soft);color:var(--accent-text)}
.st-btn.lead{font-weight:600;color:var(--text)}
.st-btn.icon{width:28px;height:28px;padding:0;justify-content:center;background:transparent;border-radius:7px}
.st-btn.icon:hover{background:var(--hover)}
.st-btn .ico{width:16px;height:16px}
.zoom{display:flex;align-items:center;gap:2px;padding:0 4px;flex-shrink:0}
.zoom input[type=range]{width:110px;accent-color:var(--accent)}
.zoom output{min-width:62px;text-align:right}
/* Immagini: i piani a sinistra, la foto al centro, le regolazioni a destra */
#photoPane,#drawPane{flex-direction:row}
.plans{display:flex;flex-direction:column;min-height:0}
.plan-item{flex-direction:column;align-items:flex-start;gap:2px}
.plan-item .d{font-size:11.5px;color:var(--text-3);white-space:normal}
.plan-item[aria-selected=true] .d{color:inherit}
.viewer{order:100;flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--canvas);overflow:hidden}
.stage{flex:1;min-height:160px;position:relative;display:grid;place-items:center;overflow:hidden}
.stage canvas{display:block;box-shadow:0 2px 12px rgba(0,0,0,.25)}
.stage canvas.alpha{background:repeating-conic-gradient(#c8c8c8 0 25%,#fff 0 50%) 0 0/16px 16px}
.stage canvas:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.stage-badge{position:absolute;left:12px;top:10px;background:var(--surface);color:var(--text);border:0;border-radius:6px;padding:3px 8px;font-size:12px;font-weight:600}
.photo-empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px;color:var(--text-2)}
.photo-empty b{display:block;font-size:17px;color:var(--text);margin-bottom:6px}
.photo-empty .row{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.viewbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 10px;background:var(--surface);border-top:1px solid var(--line);flex-shrink:0;font-size:12px;color:var(--text-2)}
.viewbar .grow{flex:1}
.adjust{display:flex;flex-direction:column;min-height:0;min-width:0}
.hist-box{padding:0 14px 8px}
.hist{width:100%;height:92px;display:block;border-radius:6px;background:var(--hist-bg);border:1px solid var(--line);forced-color-adjust:none}
.hist-text{margin:6px 0 0;font-size:12px;color:var(--text-2);line-height:1.35}
.hist-text.warn{color:var(--danger)}
html[data-theme=dark] .hist-text.warn{color:#ff8a8a}
.step-head{padding:6px 14px 8px;border-bottom:1px solid var(--line)}
.step-head h3{margin:0;font-size:14px}
