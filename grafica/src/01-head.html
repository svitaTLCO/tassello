<html lang="it" data-mode="immagini" data-theme="light" data-contrast="normal"><head>

<style>
:root{--accent:#b0306a;--accent-strong:#8c2453;--accent-text:#8c2453;--accent-soft:#fbeaf2;--sel-tint:rgba(176,48,106,.18);
--bg:#f3f3f3;--chrome:#f7f7f7;--surface:#fff;--surface-2:#f3f3f3;--hover:#e8e8e8;--pressed:#dcdcdc;--line:#e1e1e1;--line-strong:#b3b3b3;--text:#1b1b1b;--text-2:#3d3d3d;--text-3:#575757;--canvas:#e6e6e6;--focus:#1b1b1b;--danger:#b10e1c;
--hist-bg:#ffffff;--hist-l:#6b6b6b;--hist-r:#d13438;--hist-g:#2e8b3d;--hist-b:#2f6fd6;--hist-clip:#c50f1f;
--shadow:0 12px 32px rgba(0,0,0,.18),0 2px 8px rgba(0,0,0,.08);color-scheme:light;
font-family:'Segoe UI Variable Text','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;font-size:13px;color:var(--text)}
html[data-theme=dark]{color-scheme:dark;--bg:#1c1c1c;--chrome:#242424;--surface:#2c2c2c;--surface-2:#303030;--hover:#3a3a3a;--pressed:#464646;--line:#3d3d3d;--line-strong:#6a6a6a;--text:#f3f3f3;--text-2:#d9d9d9;--text-3:#bdbdbd;--canvas:#141414;--focus:#fff;--accent-text:#f59ac2;--accent-soft:#3f1a2c;
--hist-bg:#1f1f1f;--hist-l:#bdbdbd;--hist-r:#ff7b7f;--hist-g:#6fd37f;--hist-b:#7fa8ff;--hist-clip:#ff6b6b;--shadow:0 12px 32px rgba(0,0,0,.55)}
html[data-contrast=high]{--line:#000;--line-strong:#000;--text-2:#000;--text-3:#111;--hover:#cfcfcf;--accent-text:#5e1638;--hist-l:#000;--hist-clip:#b10e1c}
html[data-contrast=high][data-theme=dark]{--line:#fff;--line-strong:#fff;--text-2:#fff;--text-3:#fff;--hover:#4a4a4a;--accent-text:#ffc2dc;--hist-l:#fff;--hist-clip:#ff8080}
@media (forced-colors:active){:root{--hist-bg:Canvas;--hist-l:CanvasText;--hist-r:CanvasText;--hist-g:CanvasText;--hist-b:CanvasText;--hist-clip:Highlight}}
html[data-contrast=high] .tool,html[data-contrast=high] .tab,html[data-contrast=high] .btn{border:1px solid var(--line-strong)}
html[data-contrast=high] :focus-visible{outline-width:3px}
*,*::before,*::after{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--text)}
[hidden],.hidden{display:none!important}
button,select,input,textarea{color:inherit;font:inherit}
button{cursor:pointer}button:disabled,[aria-disabled=true]{opacity:.45;cursor:not-allowed}
:focus{outline:none}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
kbd{font:600 11px/1 'Segoe UI',system-ui,sans-serif;display:inline-block;padding:3px 6px;border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:4px;background:var(--surface);color:var(--text-2);white-space:nowrap}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:fixed;left:10px;top:-80px;z-index:1000;background:var(--surface);color:var(--text);padding:10px 16px;border-radius:8px;box-shadow:var(--shadow);font-weight:600;text-decoration:none}
.skip:focus{top:10px}
.ico{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;display:block}
.ti-text{font-weight:600;font-size:15px;line-height:1;min-width:18px;text-align:center;font-family:'Segoe UI',system-ui,sans-serif;white-space:nowrap}
#app{display:flex;flex-direction:column;height:100dvh;min-width:0}
/* Barra del titolo */
.titlebar{height:46px;flex-shrink:0;background:var(--accent);color:#fff;display:flex;align-items:center;gap:6px;padding:0 10px}
.titlebar :focus-visible{outline-color:#fff}
.brand{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px 0 6px;margin-right:4px;border:0;border-radius:8px;background:transparent;color:#fff;font:inherit;cursor:pointer}
.brand:hover{background:rgba(255,255,255,.14)}
.brand-mark{width:22px;height:22px;flex:none}
.brand-name{font-weight:700;font-size:14px;letter-spacing:.01em;white-space:nowrap}
@media (max-width:980px){.brand-name{display:none}.brand{padding:0 6px}}
.app-switch{display:flex;background:rgba(0,0,0,.2);border-radius:9px;padding:3px;gap:2px}
.app-switch button{display:flex;align-items:center;gap:7px;height:28px;padding:0 10px 0 6px;border:0;border-radius:7px;background:transparent;color:#fff;font-weight:600}
.app-switch button:hover{background:rgba(255,255,255,.14)}
.app-switch button[aria-pressed=true]{background:#fff;color:var(--accent-strong)}
.app-logo{width:19px;height:19px;border-radius:5px;display:grid;place-items:center;background:rgba(255,255,255,.22);color:#fff}
.app-logo svg{display:block}
.app-switch button[aria-pressed=true] .app-logo{background:var(--accent);color:#fff}
.tb-group{display:flex;gap:2px;margin-left:4px}
.tb-btn{border:0;background:transparent;color:#fff;width:34px;height:34px;border-radius:7px;display:grid;place-items:center}
.tb-btn:hover{background:rgba(255,255,255,.16)}.tb-btn:active{background:rgba(255,255,255,.26)}
.title-center{display:flex;align-items:center;justify-content:center;gap:10px;flex:1;min-width:120px}
.title-center input{width:min(300px,100%);min-width:0;text-align:center;background:rgba(255,255,255,.14);border:1px solid transparent;border-radius:7px;color:#fff;height:30px;padding:0 10px;font-weight:600}
.title-center input:hover{border-color:rgba(255,255,255,.55)}
.title-center input:focus{background:#fff;color:#1b1b1b;outline:2px solid #fff;outline-offset:1px}
.save-state{font-size:12px;opacity:.92;white-space:nowrap}
.cmd-search{display:flex;align-items:center;gap:8px;height:32px;min-width:210px;border-radius:7px;border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.12);color:#fff;padding:0 6px 0 10px;text-align:left}
.cmd-search:hover{background:rgba(255,255,255,.22)}
.cmd-search span{flex:1}
.cmd-search kbd{background:rgba(255,255,255,.18);color:#fff;border-color:rgba(255,255,255,.4)}
.top-action{height:32px;border-radius:7px;padding:0 12px;border:1px solid rgba(255,255,255,.6);background:transparent;color:#fff;display:flex;align-items:center;gap:7px;font-weight:600;white-space:nowrap}
.top-action:hover{background:rgba(255,255,255,.14)}
.top-action.primary{border-color:#fff;background:#fff;color:var(--accent-strong)}
/* Schede */
.tabrow{display:flex;align-items:flex-end;gap:6px;background:var(--chrome);padding:5px 10px 0;flex-shrink:0;overflow-x:auto;scrollbar-width:none}
.filebtn{height:30px;margin-bottom:4px;padding:0 15px;border:0;border-radius:7px;background:var(--accent);color:#fff;font-weight:600;flex-shrink:0}
.filebtn:hover{background:var(--accent-strong)}
.tabs{display:flex;gap:2px}
.tab{border:0;background:transparent;color:var(--text-2);height:36px;padding:0 13px;border-radius:7px 7px 0 0;position:relative;white-space:nowrap;font-weight:500}
.tab:hover{background:var(--hover);color:var(--text)}
.tab[aria-selected=true]{color:var(--accent-text);font-weight:600}
.tab[aria-selected=true]::after{content:'';position:absolute;left:12px;right:12px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--accent)}
.tab:focus-visible{outline-offset:-2px}
/* Barra multifunzione */
.ribbon{flex-shrink:0;background:var(--chrome);overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;border-bottom:1px solid var(--line)}
.ribbon-inner{display:flex;align-items:stretch;min-height:102px;padding:6px 6px 4px;margin:0 8px 8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.06);width:max-content;min-width:calc(100% - 16px)}
.rbgroup{display:flex;flex-direction:column;padding:0 9px;position:relative;flex-shrink:0}
.rbgroup+.rbgroup::before{content:'';position:absolute;left:0;top:6px;bottom:24px;width:1px;background:var(--line)}
.rbitems{display:flex;align-items:flex-start;gap:3px;flex:1}
.rbstack{display:flex;flex-direction:column;gap:5px;padding-top:2px}
.rbrow{display:flex;align-items:center;gap:2px}
.rb-label{font-size:11px;color:var(--text-3);text-align:center;padding-top:4px;white-space:nowrap}
.tool{display:inline-flex;justify-content:center;align-items:center;gap:5px;position:relative;height:30px;min-width:30px;padding:0 6px;border:1px solid transparent;border-radius:6px;background:transparent;color:var(--text);white-space:nowrap}
.tool:hover{background:var(--hover)}.tool:active{background:var(--pressed)}
.tool[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-text)}
.tool.lg{flex-direction:column;justify-content:flex-start;height:70px;min-width:54px;max-width:98px;padding:6px 6px 4px;white-space:normal;font-size:12px;line-height:1.2;gap:5px;text-align:center}
.tool.lg .ico{width:26px;height:26px;stroke-width:1.5}
.tool.lg .ti-text{font-size:21px;height:26px;display:flex;align-items:center;justify-content:center}
.tool .lbl{font-size:12px}
.chev{width:10px;height:10px;display:inline-block;vertical-align:middle;margin-left:2px;stroke-width:2}
.tool[aria-expanded=true]{background:var(--pressed)}
.rb-select{height:28px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);color:var(--text);padding:0 4px}
.rb-select:hover{border-color:var(--text-3)}
.btn{display:inline-flex;justify-content:center;align-items:center;gap:6px;height:30px;padding:0 12px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);color:var(--text);white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.primary{color:#fff;font-weight:600;background:var(--accent);border-color:var(--accent)}
.btn.primary:hover{background:var(--accent-strong)}
.btn.icon{width:30px;padding:0}
.btn.sm{height:26px;padding:0 8px;font-size:12px}
.check{display:inline-flex;align-items:center;gap:6px;font-weight:400!important}
.check input{width:16px;height:16px;accent-color:var(--accent)}
/* Area di lavoro */
.main{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.main:focus-visible{outline-offset:-3px}
.editor-pane{display:flex;flex-direction:column;flex:1;min-height:0;min-width:0}
.btn[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-text)}
.side-pane{width:270px;flex-shrink:0;background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.pane-head{display:flex;align-items:center;gap:8px;padding:10px 10px 4px 14px}.pane-head h2{font-size:14px;margin:0;flex:1}
.pane-count{font-size:12px;color:var(--text-3)}
.pane-hint{font-size:12px;color:var(--text-3);margin:0 14px 8px;line-height:1.35}
.pane-tools{display:flex;flex-wrap:wrap;gap:4px;padding:0 12px 8px}
.lb{list-style:none;margin:0;padding:4px 6px 12px;overflow:auto;flex:1;min-height:0}
.lb:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.lb-item{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;font-size:13px;line-height:1.3;cursor:pointer;border:1px solid transparent}
.lb-item:hover{background:var(--hover)}
.lb-item[aria-selected=true]{background:var(--accent-soft);color:var(--accent-text);border-color:var(--accent)}
.lb:focus-visible .lb-item.active,.lb-item.active{box-shadow:inset 3px 0 0 var(--accent)}
.lb-item .t{font:12px 'Cascadia Mono',Consolas,monospace;color:var(--text-3);flex-shrink:0}
.lb-item[aria-selected=true] .t{color:inherit}
.lb-item .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-empty{padding:8px 10px;color:var(--text-3);font-size:12.5px}
.insp-body{overflow:auto;padding:0 14px 16px;flex:1;min-height:0}
.insp-body h3{font-size:13px;margin:14px 0 4px;color:var(--text-2)}
.insp-body label{display:block;margin:10px 0 3px;font-weight:600;font-size:12.5px}
.insp-body label.check{display:flex;margin-top:10px}
.insp-body input:not([type=checkbox]):not([type=range]):not([type=color]),.insp-body select,.insp-body textarea{width:100%;padding:6px 8px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);color:var(--text)}
.insp-body input[type=range]{width:100%;accent-color:var(--accent)}
.insp-body input[type=color]{width:52px;height:30px;padding:2px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface)}
.insp-body .row2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.insp-body .hint{display:block;color:var(--text-3);font-size:11.5px;margin-top:3px}
.insp-body dl{display:grid;grid-template-columns:max-content 1fr;gap:4px 12px;margin:8px 0 0}
.insp-body dt{color:var(--text-3)}.insp-body dd{margin:0;font-weight:600}
.insp-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
/* Barra di stato */
.status{flex-shrink:0;min-height:30px;background:var(--chrome);border-top:1px solid var(--line);display:flex;align-items:center;gap:14px;color:var(--text-2);font-size:12px;padding:0 10px}
.status .grow{flex:1}
.st-btn{border:0;background:transparent;color:var(--text-2);height:26px;padding:0 8px;border-radius:5px;display:inline-flex;align-items:center;gap:6px}
.st-btn:hover{background:var(--hover)}
.st-btn.icon{width:26px;padding:0;justify-content:center}
.st-btn .ico{width:15px;height:15px}
.zoom{display:flex;align-items:center;gap:2px}
.zoom input[type=range]{width:110px;accent-color:var(--accent)}
.zoom output{min-width:62px;text-align:right}
/* Immagini: i piani a sinistra, la foto al centro, le regolazioni a destra */
#photoPane{display:grid;grid-template-columns:240px minmax(0,1fr) 310px;flex:1;min-height:0}
.plans{border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;min-height:0}
.plan-item{flex-direction:column;align-items:flex-start;gap:2px}
.plan-item .d{font-size:11.5px;color:var(--text-3);white-space:normal}
.plan-item[aria-selected=true] .d{color:inherit}
.viewer{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--canvas)}
.stage{flex:1;min-height:160px;position:relative;display:grid;place-items:center;overflow:hidden}
.stage canvas{display:block;box-shadow:0 2px 12px rgba(0,0,0,.25)}
.stage canvas.alpha{background:repeating-conic-gradient(#c8c8c8 0 25%,#fff 0 50%) 0 0/16px 16px}
.stage canvas:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.stage-badge{position:absolute;left:12px;top:10px;background:var(--surface);color:var(--text);border:1px solid var(--line-strong);border-radius:6px;padding:3px 8px;font-size:12px;font-weight:600}
.photo-empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px;color:var(--text-2)}
.photo-empty b{display:block;font-size:17px;color:var(--text);margin-bottom:6px}
.photo-empty .row{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.viewbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 10px;background:var(--chrome);border-top:1px solid var(--line);flex-shrink:0;font-size:12px;color:var(--text-2)}
.viewbar .grow{flex:1}
.adjust{border-left:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;min-height:0;min-width:0}
.hist-box{padding:0 14px 8px}
.hist{width:100%;height:92px;display:block;border-radius:6px;background:var(--hist-bg);border:1px solid var(--line);forced-color-adjust:none}
.hist-text{margin:6px 0 0;font-size:12px;color:var(--text-2);line-height:1.35}
.hist-text.warn{color:var(--danger)}
html[data-theme=dark] .hist-text.warn{color:#ff8a8a}
.step-head{padding:6px 14px 8px;border-bottom:1px solid var(--line)}
.step-head h3{margin:0;font-size:14px}
.step-head p{margin:4px 0 0;font-size:12px;color:var(--text-2);line-height:1.4}
.step-nav{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.step-nav .grow{flex:1}
.step-nav .btn.primary{margin-left:auto}
.step-count{font-size:12px;color:var(--text-3)}
.adj{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:0 6px;margin:10px 0 0}
.insp-body .adj label{margin:0;grid-column:1}
.adj output{font-variant-numeric:tabular-nums;font-size:12px;color:var(--text-2);min-width:58px;text-align:right}
.adj input[type=range]{grid-column:1/-1}
.adj .btn.icon{width:24px;height:24px}
.adj .btn.icon .ico{width:14px;height:14px}
.adj.changed label::after{content:' •';color:var(--accent-text)}
@media (max-width:1100px){#photoPane{grid-template-columns:200px minmax(0,1fr) 270px}}
@media (max-width:860px){#photoPane{grid-template-columns:1fr;grid-template-rows:minmax(240px,1fr) auto auto;overflow:auto}.plans{grid-row:2;border-right:0;border-top:1px solid var(--line);max-height:220px}.adjust{grid-row:3;border-left:0;border-top:1px solid var(--line)}}
/* Finestre e menu */
.modalbg{display:flex;justify-content:center;align-items:center;position:fixed;inset:0;z-index:350;padding:18px;background:rgba(0,0,0,.42)}
.modal{background:var(--surface);color:var(--text);border-radius:12px;box-shadow:var(--shadow);max-width:520px;width:100%;max-height:calc(100dvh - 36px);overflow:auto;padding:22px 24px}
.modal.wide{max-width:820px}
.modal h2{margin:0 0 12px;font-size:20px;font-weight:600}
.modal h3{font-size:14px;margin:18px 0 6px}
.dlg-body{line-height:1.5;color:var(--text-2)}
.dlg-body p{margin:0 0 10px}
.modal label{display:block;margin:12px 0 5px;font-weight:600}
.modal label.check{display:flex;margin-top:12px}
.modal input:not([type=checkbox]):not([type=range]):not([type=color]),.modal select,.modal textarea{width:100%;padding:8px 10px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);color:var(--text)}
.modal input[type=range]{width:100%;accent-color:var(--accent)}
.modal input[type=color]{width:60px;height:34px;padding:2px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface)}
.modal .rangebox{display:flex;align-items:center;gap:10px}.modal .rangebox output{min-width:76px;text-align:right;font-variant-numeric:tabular-nums}
.modal textarea{resize:vertical}
.modal .hint{display:block;color:var(--text-3);margin-top:4px}
.modal-actions{margin-top:20px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.modal-actions .left{margin-right:auto}
.modal table{border-collapse:collapse;width:100%;font-size:12.5px}
.modal th,.modal td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:top;font-weight:400}
.modal caption{text-align:left;font-weight:600;font-size:14px;padding:14px 0 6px;color:var(--text)}
.modal td kbd{margin:1px 2px}
.kcols{columns:2 340px;column-gap:28px}.kcols table{break-inside:avoid;margin-bottom:6px}
.progress{width:100%;height:12px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;margin:10px 0 6px}
.progress>div{height:100%;width:0;background:var(--accent)}
.issue-list{list-style:none;margin:8px 0 0;padding:0}
.issue-list li{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.ok-msg{color:var(--accent-text);font-weight:600}
.stats{display:grid;grid-template-columns:max-content 1fr;gap:6px 18px;margin:6px 0 0}.stats dt{color:var(--text-3)}.stats dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums}
.filepanel{position:fixed;inset:0;z-index:300;display:flex;background:var(--surface);color:var(--text)}
.file-side{width:250px;background:var(--accent);color:#fff;padding:14px 10px;flex-shrink:0;display:flex;flex-direction:column;gap:2px;overflow:auto}
.file-side button{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px;border:0;border-radius:8px;background:transparent;color:#fff;font-size:14px;text-align:left}
.file-side button:hover{background:rgba(255,255,255,.16)}
.file-side :focus-visible{outline-color:#fff;outline-offset:-2px}
.file-side .file-back{font-weight:600;margin-bottom:10px}
.file-info{padding:40px 48px;overflow:auto;flex:1}
.file-info h2{font-size:28px;font-weight:600;margin:0 0 6px}
.file-info>p{color:var(--text-2);margin:0 0 24px}
.file-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;max-width:900px}
.file-tile{background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:18px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:128px}
.file-tile:hover{box-shadow:0 4px 14px rgba(0,0,0,.1);border-color:var(--accent)}
.file-tile .ico{width:28px;height:28px;color:var(--accent-text);margin-bottom:4px}
.file-tile b{font-size:15px}.file-tile span{color:var(--text-2);font-size:12.5px;line-height:1.4}
.file-details{display:grid;grid-template-columns:max-content 1fr;gap:6px 18px;margin:28px 0 0;max-width:600px}
.file-details dt{color:var(--text-3)}.file-details dd{margin:0;font-weight:600}
.palette{background:var(--surface);color:var(--text);border-radius:12px;box-shadow:var(--shadow);width:min(620px,100%);align-self:flex-start;margin-top:9vh;overflow:hidden;display:flex;flex-direction:column;max-height:72vh}
.palette input{border:0;border-bottom:1px solid var(--line);padding:16px 18px;font-size:16px;background:var(--surface);color:var(--text)}
.palette input:focus-visible{outline:none;box-shadow:inset 0 -2px 0 var(--accent)}
#palList{overflow:auto;padding:6px}
.pal-opt{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:8px;cursor:pointer}
.pal-opt .ico,.pal-opt .ti-text{color:var(--text-2)}
.pal-opt[aria-selected=true]{background:var(--accent-soft);color:var(--accent-text);box-shadow:inset 3px 0 0 var(--accent)}
.pal-label{flex:1}.pal-cat{font-size:11.5px;color:var(--text-3)}
.pal-empty{padding:16px;color:var(--text-3)}
.pal-hint{margin:0;padding:8px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--text-3)}
.ctxmenu{position:fixed;z-index:420;min-width:230px;max-width:440px;max-height:72vh;overflow:auto;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:5px}
.ctxmenu [role^=menuitem]{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;padding:7px 10px;border-radius:6px;text-align:left}
.ctxmenu [role^=menuitem]:hover,.ctxmenu [role^=menuitem]:focus{background:var(--accent-soft);color:var(--accent-text);outline:none}
.ctxmenu [role^=menuitem]:focus-visible{box-shadow:inset 0 0 0 2px var(--focus)}
.ctxmenu .mi-text{flex:1;display:flex;flex-direction:column;gap:1px;min-width:0}.ctxmenu kbd{font-size:10.5px}
.ctxmenu .mi-label{font-weight:500}.ctxmenu .mi-desc{font-size:11.5px;color:var(--text-3);white-space:normal;line-height:1.3}
.ctxmenu [role^=menuitem]:focus .mi-desc,.ctxmenu [role^=menuitem]:hover .mi-desc{color:inherit}
.ctxmenu .mi-check{width:18px;display:inline-flex;justify-content:center;font-weight:700;flex-shrink:0}
.menu-sep{height:1px;background:var(--line);margin:4px 6px}
.tip{position:fixed;z-index:500;background:#1f1f1f;color:#fff;font-size:12px;padding:6px 9px;border-radius:6px;max-width:300px;pointer-events:none;box-shadow:0 4px 12px rgba(0,0,0,.25);line-height:1.35}
html[data-theme=dark] .tip{background:#f3f3f3;color:#111}
.msg{position:fixed;left:50%;bottom:46px;transform:translateX(-50%);color:#fff;background:#262626;padding:11px 18px;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.3);z-index:400;max-width:min(560px,90vw);opacity:0;pointer-events:none;transition:opacity .15s}
.msg.show{opacity:1}
html[data-theme=dark] .msg{background:#f3f3f3;color:#111}
.drop-over::after{content:'Rilascia per aprire';position:fixed;inset:12px;border:3px dashed var(--accent);border-radius:14px;background:var(--sel-tint);display:grid;place-items:center;font-size:22px;font-weight:600;color:var(--accent-text);z-index:600;pointer-events:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
/* Nelle finestre strette i testi dei pulsanti spariscono alla vista ma restano agli screen reader: sono il loro nome. */
@media (max-width:1100px){.top-action span,.cmd-search span,.save-state{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.cmd-search{min-width:0}}
@media (forced-colors:active){.tool[aria-pressed=true],.tab[aria-selected=true],.pal-opt[aria-selected=true],.lb-item[aria-selected=true]{outline:2px solid Highlight}}
@media (max-width:720px){.titlebar{gap:3px;padding:0 4px}.app-switch button{padding:0 6px}.app-switch .app-name{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.tb-group{display:none}.cmd-search kbd{display:none}.file-side{width:180px}.file-info{padding:22px}.status #helpBtn span{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}}
</style></head>
